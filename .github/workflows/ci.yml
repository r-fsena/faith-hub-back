name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: faith-hub-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: faith-hub-backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r-fsena/faith-hub-web
          ref: 08e26d90e85300d54036771e93a5851604f9d990
          path: faith-hub-web
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r-fsena/faith-hub-pwa
          ref: 65b3018d676f639f3754e4be9a4eea01fb212ee8
          path: faith-hub-pwa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r-fsena/faith-hub-site
          ref: 204ec5188e0e149a158d4e3ec64e440e5c9d203a
          path: faith-hub-site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: faith-hub-backend/package-lock.json
      - run: node scripts/check-dependency-policy.cjs
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
