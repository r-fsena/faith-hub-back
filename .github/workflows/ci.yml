name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: faith-hub-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: faith-hub-backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r-fsena/faith-hub-web
          ref: c083ec850e29a003316f3ab1b31edf69d5966ef3
          path: faith-hub-web
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r-fsena/faith-hub-pwa
          ref: 4c381719a5c0fd60fe41fc9a1e807c92a8855545
          path: faith-hub-pwa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r-fsena/faith-hub-site
          ref: 204ec5188e0e149a158d4e3ec64e440e5c9d203a
          path: faith-hub-site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: faith-hub-backend/package-lock.json
      - run: node scripts/check-dependency-policy.cjs
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
