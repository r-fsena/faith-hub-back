service: faith-hub-backend
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-2
  httpApi:
    cors:
      allowedOrigins:
        - 'https://faithhubs.com'
        - 'https://*.faithhubs.com'
        - 'https://admin.faithhubs.com'
        - 'http://localhost:5173'
        - 'http://localhost:8081'
        - 'http://localhost:3000'
        - 'http://localhost:19006'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        - asaas-access-token
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      maxAge: 3600
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.us-east-2.amazonaws.com/${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}
        audience:
          - ${env:USER_POOL_CLIENT_ID, '3ik571j3u4o4sb13bo7n4o9822'}
  environment:
    USER_POOL_ID: ${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}
    USER_POOL_CLIENT_ID: ${env:USER_POOL_CLIENT_ID, '3ik571j3u4o4sb13bo7n4o9822'}
    DB_HOST: ${env:DB_HOST, 'faith-hub.cc7220s4ekvj.us-east-1.rds.amazonaws.com'}
    DB_PORT: ${env:DB_PORT, '3306'}
    DB_USER: ${env:DB_USER, 'admin_faith_hub'}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME, 'faith-hub'}
    DB_SSL: ${env:DB_SSL, 'false'}
    S3_MEDIA_BUCKET: ${env:S3_MEDIA_BUCKET, 'faith-hub-media-bucket-rafaelsena'}
    ASAAS_API_KEY: ${env:ASAAS_API_KEY}
    ASAAS_ENVIRONMENT: ${env:ASAAS_ENVIRONMENT, 'production'}
    ASAAS_WEBHOOK_SECRET: ${env:ASAAS_WEBHOOK_SECRET}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminResetUserPassword
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminUpdateUserAttributes
          Resource: "arn:aws:cognito-idp:us-east-2:*:userpool/${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}"

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true

