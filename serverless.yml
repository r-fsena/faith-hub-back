service: faith-hub-backend
frameworkVersion: '3'
useDotenv: true

params:
  default:
    splitStacksPerType: true
    splitStacksPerGroupFunction: false
  prod:
    splitStacksPerType: false
    splitStacksPerGroupFunction: true

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-2
  versionFunctions: false
  httpApi:
    cors:
      allowedOrigins:
        - 'https://faithhubs.com'
        - 'https://www.faithhubs.com'
        - 'https://admin.faithhubs.com'
        - 'https://app.faithhubs.com'
        - 'https://pwa.faithhubs.com'
        - 'https://studio.faithhubs.com'
        - 'https://d2lyt83fsceg0b.amplifyapp.com'
        - 'https://main.d2lyt83fsceg0b.amplifyapp.com'
        - 'https://d312p1jp7kl7kp.amplifyapp.com'
        - 'https://main.d312p1jp7kl7kp.amplifyapp.com'
        - 'https://dcd98qkjlz7f5.amplifyapp.com'
        - 'https://main.dcd98qkjlz7f5.amplifyapp.com'
        - 'http://localhost:5173'
        - 'http://localhost:5174'
        - 'http://localhost:5175'
        - 'http://localhost:3000'
        - 'http://localhost:8081'
        - 'http://localhost:19006'
        - 'http://127.0.0.1:5173'
        - 'http://127.0.0.1:5174'
        - 'http://127.0.0.1:5175'
        - 'http://127.0.0.1:3000'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        - x-organization-id
        - x-campus-id
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      maxAge: 3600
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.us-east-2.amazonaws.com/${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}
        audience:
          - ${env:USER_POOL_CLIENT_ID, '3ik571j3u4o4sb13bo7n4o9822'}
  environment:
    APP_STAGE: ${sls:stage}
    USER_POOL_ID: ${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}
    USER_POOL_CLIENT_ID: ${env:USER_POOL_CLIENT_ID, '3ik571j3u4o4sb13bo7n4o9822'}
    DB_SECRET_ARN: ${env:DB_SECRET_ARN, ''}
    DB_SSL: ${env:DB_SSL, 'require'}
    RATE_LIMIT_TABLE: !Ref RateLimitTable
    SAAS_OPERATIONS_QUEUE_URL: !Ref SaasOperationsQueue
    S3_MEDIA_BUCKET: ${env:S3_MEDIA_BUCKET, 'faith-hub-media-bucket-rafaelsena'}
    ASAAS_SECRET_ARN: ${env:ASAAS_SECRET_ARN, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminResetUserPassword
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminUpdateUserAttributes
          Resource: "arn:aws:cognito-idp:us-east-2:*:userpool/${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}"
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - ${env:DB_SECRET_ARN, 'arn:aws:secretsmanager:us-east-2:*:secret:faith-hub/database/runtime-*'}
            - ${env:ASAAS_SECRET_ARN, 'arn:aws:secretsmanager:us-east-2:*:secret:faith-hub/asaas/platform-*'}
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
          Resource: !GetAtt RateLimitTable.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: !GetAtt SaasOperationsQueue.Arn

plugins:
  - serverless-plugin-split-stacks
  - serverless-esbuild
  - serverless-offline

custom:
  splitStacks:
    nestedStackCount: 20
    perFunction: false
    perType: ${param:splitStacksPerType}
    perGroupFunction: ${param:splitStacksPerGroupFunction}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true

resources:
  Resources:
    RateLimitTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-rate-limits
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: rate_key
            AttributeType: S
        KeySchema:
          - AttributeName: rate_key
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true
    SaasOperationsDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-saas-operations-dlq
        MessageRetentionPeriod: 1209600
    SaasOperationsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-saas-operations
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt SaasOperationsDeadLetterQueue.Arn
          maxReceiveCount: 5

