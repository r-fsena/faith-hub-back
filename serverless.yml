service: faith-hub-backend
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-2
  httpApi:
    cors: true
  environment:
    # EsteUserPool ID real vem da arquitetura do aplicativo. Você precisa garantir que a role Lambda tem acesso.
    USER_POOL_ID: ${env:USER_POOL_ID, 'us-east-2_pLrj1NgHI'}
    DB_HOST: ${env:DB_HOST, 'faith-hub.cc7220s4ekvj.us-east-1.rds.amazonaws.com'}
    DB_PORT: ${env:DB_PORT, '3306'}
    DB_USER: ${env:DB_USER, 'admin_faith_hub'}
    DB_PASSWORD: ${env:DB_PASSWORD, '30ago2015Ra!'}
    DB_NAME: ${env:DB_NAME, 'faith-hub'}
    DB_SSL: ${env:DB_SSL, 'false'}
    S3_MEDIA_BUCKET: ${env:S3_MEDIA_BUCKET, 'faith-hub-media-bucket-rafaelsena'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminResetUserPassword
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminUpdateUserAttributes
          Resource: "arn:aws:cognito-idp:us-east-2:*:userpool/us-east-2_pLrj1NgHI"

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true

functions:
  inviteMember:
    handler: src/functions/members.invite
    events:
      - httpApi:
          path: /members/invite
          method: post
          
  updateMemberStatus:
    handler: src/functions/members.updateStatus
    events:
      - httpApi:
          path: /members/status
          method: put
          
  resetPassword:
    handler: src/functions/members.resetPassword
    events:
      - httpApi:
          path: /members/reset-password
          method: post

  listMembers:
    handler: src/functions/members.list
    events:
      - httpApi:
          path: /members
          method: get
          
  getMember:
    handler: src/functions/members.get
    events:
      - httpApi:
          path: /members/{id}
          method: get
          
  updateMember:
    handler: src/functions/members.update
    events:
      - httpApi:
          path: /members/{id}
          method: put

  requestCell:
    handler: src/functions/members.requestCell
    events:
      - httpApi:
          method: post
          path: /members/{id}/request-cell

