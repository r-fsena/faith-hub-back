AWSTemplateFormatVersion: '2010-09-09'
Description: Private asynchronous Faith Hubs reports; deploy separately from legacy backend stacks after change-set review.
Parameters:
  Environment:
    Type: String
    AllowedValues: [development, staging, production]
  DatabaseSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  DatabaseSecretRegion:
    Type: String
  CognitoUserPoolId:
    Type: String
  ExistingApiRoleNames:
    Type: CommaDelimitedList
    Description: Reviewed existing Lambda roles permitted to enqueue reports and proxy authorized downloads.
  CodeS3Bucket:
    Type: String
    Description: Private artifact bucket in the same region. Upload only a verified clean-commit artifact.
  CodeS3Key:
    Type: String
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
Conditions:
  WorkerVpcEnabled: !Not [!Equals [!Select [0, !Ref VpcSubnetIds], '']]
Resources:
  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 30
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ReportsBucket.Arn, !Sub '${ReportsBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': false}}
  ReportsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  ReportsQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 780
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportsDeadLetterQueue.Arn
        maxReceiveCount: 4
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/faith-hub-intelligence-reports-${Environment}'
      RetentionInDays: 30
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If [WorkerVpcEnabled, 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole', !Ref 'AWS::NoValue']
      Policies:
        - PolicyName: ReportsWorkerOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${ReportsBucket.Arn}/reports/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt ReportsQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WorkerLogGroup.Arn
  ReportsWorker:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub 'faith-hub-intelligence-reports-${Environment}'
      Runtime: nodejs22.x
      Architectures: [x86_64]
      Handler: src/functions/intelligenceReports.intelligenceReportsWorker
      Role: !GetAtt WorkerRole.Arn
      Timeout: 120
      MemorySize: 1024
      Code: {S3Bucket: !Ref CodeS3Bucket, S3Key: !Ref CodeS3Key}
      VpcConfig: !If
        - WorkerVpcEnabled
        - {SubnetIds: !Ref VpcSubnetIds, SecurityGroupIds: !Ref VpcSecurityGroupIds}
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DatabaseSecretArn
          DB_SECRET_REGION: !Ref DatabaseSecretRegion
          DB_SSL: require
          USER_POOL_ID: !Ref CognitoUserPoolId
          INTELLIGENCE_REPORTS_BUCKET: !Ref ReportsBucket
          INTELLIGENCE_REPORTS_QUEUE_URL: !Ref ReportsQueue
  WorkerSubscription:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ReportsWorker
      EventSourceArn: !GetAtt ReportsQueue.Arn
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: {MaximumConcurrency: 2}
  ProducerPermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'faith-hub-intelligence-reports-producer-${Environment}'
      Roles: !Ref ExistingApiRoleNames
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt ReportsQueue.Arn
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${ReportsBucket.Arn}/reports/*'
Outputs:
  QueueUrl: {Value: !Ref ReportsQueue}
  QueueArn: {Value: !GetAtt ReportsQueue.Arn}
  BucketName: {Value: !Ref ReportsBucket}
  WorkerName: {Value: !Ref ReportsWorker}
